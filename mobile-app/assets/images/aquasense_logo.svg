<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <style>
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 54px;
        fill: #1e6b52;
      }
      .brand-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        font-size: 24px;
        fill: #5a6e7f;
      }
    </style>
  </defs>

  <!-- Water droplet icon container -->
  <g transform="translate(15, 10)">
    <!-- Droplet body -->
    <path d="M 65,10 C 65,10 115,75 115,105 A 50,50 0 1,1 15,105 C 15,75 65,10 65,10 Z"
          fill="#1e6b52" />

    <!-- Copper / Terracotta dot on top right slope -->
    <circle cx="102" cy="40" r="9" fill="#cc7a42" />

    <!-- Pulse / ECG line in white -->
    <path d="M 22,105 L 48,105 L 60,78 L 74,128 L 86,105 L 108,105"
          fill="none"
          stroke="#ffffff"
          stroke-width="6.5"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- AquaSense text -->
  <text x="160" y="80" class="brand-title">AquaSense</text>
  <!-- Subtitle -->
  <text x="162" y="118" class="brand-subtitle">Smart water monitoring</text>
</svg>
